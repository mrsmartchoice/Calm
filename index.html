<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Secret Surprise Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff0f5;--bg2:#e9ddff;--card:#fff;--ink:#4a2545;--soft:#8a6585;--rose:#ff6f9f;--rose2:#ff9ec0;--lav:#b79cf2;--line:#f3c9da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1530;--bg2:#1f1a3d;--card:#3a2142;--ink:#ffe9f2;--soft:#d3aecb;--line:#6a3d70;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1530;--bg2:#1f1a3d;--card:#3a2142;--ink:#ffe9f2;--soft:#d3aecb;--line:#6a3d70;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
h1,h2,.btn{font-family:'Fredoka','Trebuchet MS',sans-serif}
.heart{position:fixed;bottom:-40px;font-size:22px;opacity:.5;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.card{position:relative;z-index:2;width:100%;max-width:400px;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 18px 40px rgba(255,111,159,.18)}
.screen{display:none}.screen.on{display:block}
h1{font-size:28px;margin:6px 0 8px;line-height:1.15}h2{font-size:26px;margin:8px 0 18px;line-height:1.2}
p{color:var(--soft);margin:0 0 16px;line-height:1.5}
.badge{display:inline-block;background:var(--bg2);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:700;margin-bottom:10px}
label{display:block;text-align:left;font-size:14px;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:16px}
input:focus-visible,.btn:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.btn{border:0;border-radius:99px;padding:14px 26px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--rose),var(--lav));cursor:pointer;width:100%;margin-top:18px}
.link{background:none;border:0;color:var(--soft);font:inherit;font-size:14px;margin-top:14px;cursor:pointer;text-decoration:underline}
.bar{height:14px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:18px 0 12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose2),var(--lav));transition:width .9s ease}
#msg{min-height:48px;font-weight:700}
.row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:120px}
#yes{width:auto;margin:0;font-size:22px;padding:16px 40px;transition:transform .2s}
#no{width:auto;margin:0;background:var(--bg2);color:var(--ink);padding:12px 22px;font-size:16px;transition:left .25s,top .25s,transform .25s}
#no.fly{position:fixed;z-index:5}
#toast,#hint{min-height:24px;font-weight:700;color:var(--rose);margin-top:8px}
.fx{position:fixed;top:-30px;z-index:9;font-size:26px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
